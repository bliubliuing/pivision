[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pivision-mcp-server"
version = "6.1.0"
description = "pivision MCP Server - 视觉识别与图像生成（r-pic/r-vid/g-pic/i-pic/p-pic/b-gen）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.0,<2",
    "pillow>=11.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
pivision = "pivision:main"

[tool.setuptools]
py-modules = ["pivision", "utils"]

[tool.setuptools.packages.find]
include = ["adapters", "adapters.*"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
